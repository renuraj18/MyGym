name: EAS Build (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        options: [production, preview, development]
        default: production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev > Account settings > Access tokens)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Expo doctor
        run: npx expo-doctor || true

      - name: Check JS bundle (same step that failed on EAS)
        run: npx expo export --platform android --output-dir /tmp/export-check

      - name: Start EAS build
        run: eas build -p android --profile ${{ inputs.profile || 'production' }} --non-interactive --no-wait
