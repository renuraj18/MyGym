name: EAS Build (Android)

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        options: [production, preview, development]
        default: production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev > Account settings > Access tokens)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Expo doctor
        run: npx expo-doctor || true

      - name: Check JS bundle (same step that failed on EAS)
        run: npx expo export --platform android --output-dir .export-check

      - name: Link EAS project (if app.json has no projectId yet)
        run: |
          if ! grep -q '"projectId"' app.json; then
            eas init --non-interactive --force
            echo "Linked project:"; grep -A2 '"eas"' app.json
          fi

      - name: Recent EAS builds
        run: eas build:list --platform android --limit 3 --non-interactive || true

      - name: Start EAS build (production, don't wait)
        if: ${{ (inputs.profile || 'production') == 'production' }}
        run: eas build -p android --profile production --non-interactive --no-wait

      - name: Build APK and wait (preview / development)
        if: ${{ (inputs.profile || 'production') != 'production' }}
        run: |
          eas build -p android --profile ${{ inputs.profile }} --non-interactive --wait --json > build.json
          URL=$(node -e "const b=require('./build.json');console.log((Array.isArray(b)?b[0]:b).artifacts.buildUrl)")
          echo "APK: $URL"
          curl -fsSL "$URL" -o MyGym-${{ inputs.profile }}.apk
          ls -lh MyGym-*.apk

      - name: Attach APK to this run
        if: ${{ (inputs.profile || 'production') != 'production' }}
        uses: actions/upload-artifact@v4
        with:
          name: MyGym-${{ inputs.profile }}-apk
          path: MyGym-*.apk
          retention-days: 30
