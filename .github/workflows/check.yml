name: Check app (types + bundle)

on:
  workflow_dispatch:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Expo doctor
        run: npx expo-doctor || true
      - name: Bundle Android JS
        run: npx expo export --platform android --output-dir .export-check
